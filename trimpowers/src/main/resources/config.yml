# ============================================================
#  TrimPowers - Trims SMP
#  Every armor trim pattern = passive perks (per piece worn)
#  + a full-set ability (Sneak + F, or /trims ability).
#  Change any number below, then run /trims reload.
# ============================================================

settings:
  # How many pieces of the SAME trim are needed to unlock its ability (1-4).
  pieces-for-ability: 4
  # SNEAK_SWAP = Sneak + F (swap-hands key) fires the ability. COMMAND_ONLY = only /trims ability.
  trigger: SNEAK_SWAP
  # Worlds where trim powers (passives and abilities) are turned off.
  disabled-worlds: []
  hud:
    # Action bar showing your ability cooldown and active effects (players can toggle with /trims hud).
    enabled: true
    # Show "READY" when your ability is off cooldown (otherwise only shows while cooling down).
    show-ready: true
  targets:
    # Abilities can hit other players (still respects world PvP and scoreboard teams with friendly-fire off).
    players: true
    hostile-mobs: true
    # Animals, villagers, golems, etc. Off by default so area abilities don't wreck farms.
    other-mobs: false
    # Ask protection plugins (WorldGuard, GriefPrevention, Lands...) before an ability touches someone.
    respect-protection: true
  # Withers, Ender Dragons, Wardens and Elder Guardians ignore Stun and Root.
  boss-crowd-control-immunity: true
  # Drinking milk clears custom debuffs too.
  milk-cleanses-debuffs: true

# ------------------------------------------------------------
#  Custom effects (shared settings; strength/duration come from the ability that applies them)
# ------------------------------------------------------------
effects:
  bleed:
    interval-ticks: 20          # damage every second
  shocked:
    interval-ticks: 15
    interrupt-items: true       # zaps interrupt eating, blocking and drawing bows
  soulburn:
    interval-ticks: 20
    healing-reduction: 0.5      # -50% healing while burning
  frostbite:
    freeze-visual: true         # frozen screen overlay (no vanilla freeze damage)
  marked:
    glow: true
  warded:
    break-pulse-radius: 5.0
    break-pulse-damage: 3.0
    break-pulse-knockback: 1.2
  berserk:
    lifesteal: 0.15             # heal 15% of melee damage dealt
    speed-bonus: 0.10
  overcharged:
    chain-targets: 3
    chain-radius: 5.0
    shocked-seconds: 3
    shocked-damage: 0.5
    proc-cooldown-ticks: 10     # stops spam-clicking from chaining every click
  shadowstep:
    reveal-bonus-damage: 0.6    # +60% damage on the first hit out of Shadowstep
    reveal-bleed-seconds: 4
    reveal-bleed-damage: 1.0

