#  Everything below only works while wearing the full set (all 4 pieces).
#  passive: the trim's built-in passive bonus.
#  potions: permanent potion effects.
#     effect = any non-instant effect (speed, strength, haste, resistance, night_vision, ...)
#     level  = 1 for Speed I, 2 for Speed II ...
#  perks: signature passives for the full set. Any perk works on any trim:
#     weapon-damage, fall-damage, extra-jump, ocean-blessing, undertow, pathfinder, navigator,
#     vein-miner, auto-smelt, prospector, wardens-calm, deep-dark-sight, shadow-crawl, wisdom,
#     bounce, xp-hunter, level-power, double-jump, static-charge, chain-reaction
